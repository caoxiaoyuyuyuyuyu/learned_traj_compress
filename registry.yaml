      feature baseline 不工作，则证明 RL 编码了非线性但结构化的多目标信息。
    parent: exp_004_phase1c_probing
    notes: '## NO-GO 结案 (2026-04-10)


      ### 硬事实纠正

      - **hidden_dim = 3584**（之前 notes 误记 4096，Qwen2.5-7B 实际为 3584，已纠正）

      - **实际采样 layers**：计划 {0,3,7,11,15,19,23,27}，被 kill 时仅跑完 {0,3,7,11,15,19}（L23/L27
      未达）

      - **n_samples = 300**（log 确认 "300 prompts built"，不是方案里的 400）

      - **进程终止状态**：reviewer 在 L0–L19 数据上判定方向性已定，2026-04-10 对 PID 299575 发 SIGTERM，进程干净退出；最后到达
      Layer 19 k=64 末尾 random_feature_mlp control 行（部分保留）。log 保留在 `/root/autodl-tmp/learned_traj_compress/logs/exp_007_mlp_probe.log`
      (107398 bytes)。


      ### 两条 CRITICAL 数据点（证伪假说）

      1. **MLP ρ 几乎全面输给 Linear ρ**（47/55 pairs, 85.5%；paired t = -8.192, p = 4.83e-11,
      Cohen''s d = -1.105；MLP mean ρ = -0.011, Linear mean ρ = 0.073；mean diff MLP−Linear
      = -0.084）——与"RL 信息编码在非线性流形上"假说方向性直接冲突。如果存在非线性结构，MLP 应严格 ≥ Linear，实际恰好相反。

      2. **Random feature 噪声带 |ρ| ≤ 0.224**（5 个 delta_h_random bases × 6 layers ×
      2 k，Linear 侧 |ρ| max = 0.224；MLP 侧 |ρ| max = 0.142，mean -0.035）。n=300 下这个 noise
      floor 已经吃掉几乎所有真实 feature——55 个 real pairs 中 Linear |ρ| 超过 0.224 的只有 3 个（5.45%）。MLP
      + Linear 双阴性，"RL 非线性多目标流形"假说被证伪。


      ### 结论

      Phase 1c 非线性 probe 假说 NO-GO（confirmed）。不再 resume 跑 L23/L27——方向已定，补完也只能让阴性更阴性。"RL
      编码非线性流形"叙事从项目中剔除，仅保留降级的"linear subspace / SVD top-k 捕获 RL−base delta"叙事（来自 exp_003
      SVD 分析），该部分未被此实验触及。


      Artifact: `artifacts/exp_007_phase1c_mlp_probe/data/exp_007_mlp_probe_results.json`
      (120 rows, 12 summary keys)'
