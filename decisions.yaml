- id: D027
  date: 2026-04-10 23:09 UTC
  summary: 'D027: Stage 1 race condition 真因纠正 — 三因叠加（harness rate-limit 杀 worker +
    framework retry 用 stale ckpt + worker 绕过 run.sh 手写 nohup），supersedes D026 根因描述'
  rationale: audit worker 完整诊断锁定真因，D026 之前的"未清理残留 eval orchestrator"是表象。真实时间线：(1)
    21:41 UTC 新 train worker 启动 → SFT 在 22:22 UTC 落盘 → 22:27 起 DPO_N2 nohup → 22:30:43
    worker 被 harness 5h rate-limit 硬杀（result.json 含 'You hit your limit · resets 4pm
    PT' + stop_reason=stop_sequence + error=rate_limit + is_error=true），但 framework
    误标 status=done；(2) 22:31:17 DPO_N2 nohup 因独立于 LLM session 跑完落盘；(3) 22:34 framework
    auto-spawn retry1 worker，retry 看到 on-disk sft_shared(22:22)+dpo_N2(22:31) 已有就直接
    nohup 起 4 阶段 eval orchestrator，**没核查 dpo_N4(20:00)/dpo_N8(20:07) ckpt mtime <
    SFT(22:22)**——用 stale N4/N8 adapter 配新 SFT base。这就是我先前看到的"旧 eval orchestrator
    PID 104623"——不是失控遗留脚本，而是 retry 工作逻辑 bug。(4) 方法论 miss：项目本来有 scripts/exp_006_stage1_run.sh（含
    for N in 2 4 8 + set -euo pipefail），原 worker 和 retry worker 都绕过它手写 per-stage nohup，否则
    bash loop 会独立于 LLM session 跑完。三个 framework/worker bug 必须都治：(a) harness 把 rate_limit_killed
    当 done，应标 status=rate_limited 并 gate retry 到 wall-clock reset 时间；(b) framework
    retry worker 无 resume 协议，应强制 upstream ckpt mtime ≤ downstream ckpt mtime 一致性检查（mtime
    链 invalidate）；(c) worker 标准规则：项目存在 orchestrator 脚本时必须优先调用，禁止手写 per-stage nohup。已采取的纠正动作：D026
    已记录的 kill 旧 eval、rm stale dpo_N4/N8 仍有效；新增动作 wandb sync sft_shared+dpo_N2 offline
    runs、修 dpo.py 落盘 trainer.state.log_history、改 run.sh 加 SKIP_N2 env 走 orchestrator、N4/N8
    重训采纳 epochs=1+beta=0.05+lr=2e-5+max_grad_norm=1.0（针对 chosen-suppression 病态：rewards/chosen
    从 +0.0415 单调跌到 -1.908）、hypothesis 文本改为"matched at raw-pair level"显式声明（论文 Methods
    同步），sub_models provenance 已写入 registry。
