- id: D007
  date: 2026-04-09 20:50 UTC
  summary: 'D007: exp_002 prompt 格式不匹配确认，方案 B 修正后重跑 collapse curve'
  rationale: exp_002 原始结果 MEM1 N=1 EM=16%（不可信）。排查发现 5 个 prompt 维度与 MEM1 训练设置不匹配（最致命：单轮
    reader vs 迭代搜索 agent）。方案 B（模拟最后一轮搜索完成）sanity check N=1 EM=80%，确认 prompt 是主因。exp_002v3
    用修正 prompt 重跑全量 collapse curve。教训：使用 RL 微调模型时必须严格匹配训练 prompt 格式。
  related_experiments:
  - exp_id: exp_002_phase1a_collapse_curve
    role: failed
