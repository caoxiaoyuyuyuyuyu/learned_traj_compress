- id: D019
  date: 2026-04-10 16:37 UTC
  summary: 'D019: Stage 1 训练方案重设计——pooled SFT + per-N DPO，解决高 N SFT 数据稀缺问题'
  rationale: N=4 SFT 仅 76 条（perfect rate 15.2%），N=8 预计 <25 条。per-N 独立 SFT 训练不可行。改为：(1)
    pooled SFT：合并全部 N 的 perfect trajectories (~580+ 条) 训练 shared SFT base；(2) per-N
    DPO：在 shared SFT 上分别用 N=2/4/8 preference pairs 微调。优势：SFT baseline 统一充足，DPO 贡献被干净隔离，可直接验证"DPO
    在高 N 下贡献更大"的核心 claim。不重跑数据生成，N=8 继续。
