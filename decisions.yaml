    N=8 仅 2 样本（0.35% of pooled SFT），shared pooled SFT 5 epochs 在 N=8 上的总梯度信号 = 2×5=10
    次反向，等于"根本没在 N=8 上训练过"。D021 Go/Stop 核心判读"matched N=8 DPO−SFT ≥ 3pp"在结构上无法成立——任何审稿人
    2 行可拆："Your N=8 SFT baseline saw 2 training examples; the gap is starvation, not
    method." 同时 SFT (em_full=1) vs DPO (em_gap≥0.1, partial OK) 入选准则不可比，"matched-sample"
    也无法救——matched-sample 只对齐 prompts 数量，对齐不了过滤准则差异。三选一中 (A) 是唯一同时满足 (i) 与 D022 闭环
    (ii) 不需要额外 GPU (iii) 不弱化 story 的方案。(B) 砍 N=8 退化到 D013 失败模式附近；(C) 0.4% perfect
