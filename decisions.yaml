- id: D021
  date: 2026-04-10 18:24 UTC
  summary: (1) Go/Stop 矩阵从 2 行扩为 5 行，为 matched-sample 下增补 matched≈SFT/full>SFT、matched
    差距<1pp、不同 N 结果矛盾三种真实情形，并定义可投阈值 = matched N=8 DPO - SFT ≥ 3pp 且 paired bootstrap
    p<0.05。(2) 单 student size + 单 dataset 风险升级为 critical，Phase 2 budget 30h→20h 挪
    10h 到新增 Phase 1.5 (15h GPU，Phase 3 再挪 5h)，用于 {另一 student size 1.5B 或 7B, 另一 dataset
