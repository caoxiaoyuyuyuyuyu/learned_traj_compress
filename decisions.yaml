- id: D008
  date: 2026-04-09 21:57 UTC
  summary: 'D008: Phase 1a collapse curve 2/3 GO — collapse 存在但为渐进衰减非相变，调整核心假设'
  rationale: exp_002v3 结果：MEM1 EM 0.62→0.34（N=1→16），统计显著（p<0.05），collapse rate 38%→66%。RL-base
    gap 全部≥0.1。但无非线性拐点——衰减近似线性（~0.018/N unit），不支持原假设的"N>6 phase transition"。调整假设为"gradual
    capacity saturation"：随目标数增加，RL 模型能力线性退化而非突变。这仍是有意义的发现，但论文 story 需从"灾难性 collapse"调整为"渐进式能力饱和"。Phase
    1b SVD 继续推进，目标变为理解线性衰减的机制。
  related_experiments:
  - exp_id: exp_002v3_phase1a_collapse_curve
    role: primary
    result: partial_go
  depends_on:
  - D007
  - D006
- id: D009
  date: 2026-04-09 22:17 UTC
  summary: 'D009: Phase 1b SVD 发现 RL 变化 97.6% 在正交子空间——论文核心机制确立'
  rationale: exp_003 SVD 分析：RL 不扩展秩（Δ≈0）、不旋转方向（1.26°）、alignment≈1.0，但 97.6% 的 ΔW 能量在
    base top-256 子空间之外。层间分布均匀（非局部 mode collapse）。MLP 比 attention 更极端（99.7% vs 96.1%）。核心假设从"mode
    collapse"修正为"RL 知识存在于正交子空间，SFT/LoRA 等 low-rank 方法无法捕获"。这对 Phase 2 有直接影响：需要 orthogonal-preserving
    distillation 而非 mode-covering（DPO）。
  related_experiments:
  - exp_id: exp_003_phase1b_svd_analysis
    role: primary
    result: partial_go
  depends_on:
  - D008
- id: D010
  date: 2026-04-09 22:24 UTC
  summary: 'D010: D009 "正交子空间"结论暂停——缺少随机基线，97.6% 是高维几何必然'
  rationale: Reviewer 指出：双侧投影 top-256 在高维矩阵中，随机 ΔW 的期望 in-subspace ratio 仅 0.1-0.5%。exp_003
    观测的 in-ratio（attention 3.9%, MLP ~0.3%）实际是随机的 3-7.6 倍，说明 RL 变化与 base 子空间有超随机对齐——与"正交添加信息"结论完全相反。必须补充：(a)
    随机基线 (b) k 灵敏度分析 (c) 单侧投影 (d) 维度归一化对比，才能下结论。
  related_experiments:
  - exp_id: exp_003_phase1b_svd_analysis
    role: primary
    result: inconclusive
  depends_on:
  - D009
- id: D011
  date: 2026-04-09 22:40 UTC
  summary: 'D011: 随机基线彻底推翻"正交子空间机制"——RL 变化实为 base 主方向的超随机对齐'
  rationale: exp_003b 随机基线校准：obs/random 比值在 k=64 时高达 6.49x，k 越小对齐越强，说明 RL 优先修改 base
    最重要的主方向。MLP 对齐度（3.49x）高于 attention（2.25x），反转原始结论。单侧投影揭示不对称：attention 沿输出空间，MLP
    沿输入空间。论文 story 从"正交添加新信息"修正为"在已有子空间方向上的精细调整"。exp_004 probing 假设需调整。
  related_experiments:
  - exp_id: exp_003_phase1b_svd_analysis
    role: primary
    result: revised
  - exp_id: exp_003b_random_baseline
    role: calibration
    result: success
  depends_on:
  - D010
- id: D012
  date: 2026-04-09 23:58 UTC
  summary: 'D012: Phase 1c probing 阴性——主方向 Δh 无法线性预测 per-objective EM；但三方 SVD 发现 RL
    对齐度是 SFT 的 1.89 倍'
  rationale: exp_004 probing 全面失败：binary AUC 最高 0.634（接近随机），主方向 probe 未优于随机方向，regression
    R²<0。"主方向精细调整编码多目标能力"假设不成立。但三方 SVD 对比发现：RL obs/random 2.78x vs SFT 1.47x（k=256），RL
    比 SFT 更精确沿 base 主方向调整，所有 k 值一致。单侧不对称性三个对比中一致。这是观察性发现，需 Phase 1d 蒸馏实验闭合因果链。
