    gap 诊断框架 methods paper、pivot。(4) W1 时间线拆为 04/11 bugfix+smoke / 04/12 review+训练启动
    / 04/13 训练完成+初步分析。
  rationale: Reviewer 对 ROADMAP 4 warning：Go/Stop 二元化（缺 matched≈SFT/full>SFT、<1pp、N
    矛盾分支）；AAAI viability 不足（3 obs 阴性/中性 + 1 弱阳性 method claim，单 student size + 单 dataset
    + single teacher + 小 sample size → desk reject 级攻击面）；Stop 后无 fallback 导致 AI 过度乐观拖延陷阱；W1
    3 天时间线不现实（bugfix ≤3 轮 + review 循环墙钟 + 训练 + 分析）。这些战略空白不在 Stage 1 启动前定清，会在"是否进 Phase
    2"节点浪费一个决策周期。
