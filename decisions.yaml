  summary: 'SFT 入选准则从 `is_perfect (total_em == n_objectives, em_full=1)` 改为 `partial-credit:
    total_em ≥ 1`（即 chosen response 至少答对 1 个 objective），与 DPO chosen 同口径。从已有 raw_trajectories_N{2,4,8}.json
    重新提取 sft_data，不重跑 RL teacher。预计 SFT N=8 从 2 样本 → ~270-300 样本（与 DPO_N8=277 同量级）。--balanced_sft
    重定义为 subsample 到新 min(SFT_per_N)。paper limitations 必须明确写明"SFT 入选 = partial-credit,
    与传统 learn-from-perfect-demos 不同; 选择源于 D022 主张指标 em_partial 的语义闭环"。Stage 1 启动前必须完成数据重提取
    + 新 stats.json + 新 matched_size 计算。'
