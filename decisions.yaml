decisions:
- id: D001
  date: 2026-04-09 12:52 UTC
  summary: Phase 1d 改为 2×2 对照设计（size × method），MEM1 go/no-go deadline 04/11，时间线加 buffer
    week
  rationale: Reviewer 指出 Phase 1d 原设计（3B SFT vs 1.5B DPO）有混淆变量——模型大小和训练方法同时变化，无法分离
    capacity 和 mode collapse 效应。改为 1.5B SFT / 1.5B DPO / 3B SFT / 3B DPO 的 2×2 设计。同时采纳
    go/no-go deadline（避免 MEM1 权重不可用时无限等待）、GPU 预算基准测试、EM reward 鲁棒性 ablation、buffer
    week 等建议。
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-04-09 12:54 UTC
  summary: 'MEM1 go/no-go: GO — 权重公开可用，项目正式推进'
  rationale: Agent 调研确认 MEM1 7B RL policy 权重在 HuggingFace 公开（Mem-Lab/Qwen2.5-7B-RL-RAG-Q2-EM-Release）。SVD
    rotation 分析代码也公开。SFT baseline 未公开但可从 MEM1 训练代码复现。BOND 无官方代码但可用 TRL 等价实现。唯一待验证：HF
    页标注 1.0B 参数，可能是 LoRA adapter 而非完整权重，已派 Agent 优先验证。
  related_experiments: []
  depends_on: []
- id: D003
  date: 2026-04-09 13:06 UTC
  summary: 统一 EM 标准化用 normalize_answer()；Phase 2a 预留 reward normalization 两种方案
  rationale: Reviewer 发现 MEM1 训练用 normalize_answer()（移除 articles）而评估用 preprocess_text()（不移除），不一致会导致所有
    phase 的数据不可比。统一用 normalize_answer() 与训练一致。同时 reward scale 随 objective count 线性增长（N=4
    只有 5 个离散 level），低 N 时 Best-of-N pair 质量下降，需 normalization。
  related_experiments: []
  depends_on: []
