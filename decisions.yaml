  summary: 'D018: exp_007 Phase 1c 非线性 probe 证否，结案 NO-GO — Story 稳固性 黄→红'
  rationale: Reviewer 基于 L0–L19 原始日志判定数据方向与假说相反，不需要等 L23/L27。关键证据：(1) MLP ρ 几乎全面输给
    Linear ρ（47/55 pairs, 85.5%, paired t=-8.192, p=4.83e-11, Cohen's d=-1.105），与'非线性流形'假说方向性直接冲突；(2)
